<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ToTheDoor · live</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🚪</text></svg>" />
  <style>
    @font-face { font-family: Geist; src: local('Geist'); }
    :root {
      --bg: #131209; --panel: #181818; --panel2: #1f1f1f; --line: #272727; --line2: #313131;
      --text: #f4f3ee; --muted: #9b9b9b; --accent: #ffbf1f; --go: #37d07a; --stop: #ff5a52; --rider: #5ab0ff;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --s100: 12px; --s200: 16px; --s300: 24px; --s400: 32px;
      font-family: Geist, "Geist Fallback", system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); overflow: hidden; }
    .wrap { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

    /* top status strip */
    header { display: flex; align-items: center; gap: var(--s300); padding: var(--s100) var(--s300); border-bottom: 1px solid var(--line); background: var(--panel); }
    .brand { font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
    .brand .dot { width: 8px; height: 8px; border-radius: 99px; background: var(--go); box-shadow: 0 0 10px var(--go); }
    .status { margin-left: auto; display: flex; align-items: center; gap: var(--s200); font-size: 14px; color: var(--muted); }
    .pill { padding: 6px 12px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line2); color: var(--text); font-weight: 500; transition: all 400ms var(--ease); }
    .pill.live { border-color: var(--accent); color: var(--accent); }

    main { display: grid; grid-template-columns: 1.15fr 1fr; min-height: 0; }
    @media (max-width: 920px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }

    /* map panel */
    .map { position: relative; border-right: 1px solid var(--line); background: #0d0d0d; }
    .map gmp-map-3d, .map #map2d { position: absolute; inset: 0; width: 100%; height: 100%; }
    .maptoggle { position: absolute; top: var(--s200); right: var(--s200); z-index: 5; display: flex; background: rgba(24,24,24,0.8); backdrop-filter: blur(8px); border: 1px solid var(--line2); border-radius: 12px; overflow: hidden; }
    .maptoggle button { background: transparent; color: var(--muted); border: 0; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; transition: all 300ms var(--ease); }
    .maptoggle button.on { background: var(--panel2); color: var(--text); }
    .legend { position: absolute; left: var(--s200); bottom: var(--s200); z-index: 5; background: rgba(24,24,24,0.82); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 14px; padding: var(--s100) var(--s200); font-size: 12px; color: var(--muted); max-width: 300px; }
    .legend b { color: var(--text); font-weight: 600; }

    /* conversation panel */
    .conv { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
    .conv h2 { font-size: 13px; font-weight: 600; color: var(--muted); padding: var(--s200) var(--s300) var(--s100); letter-spacing: 0.02em; text-transform: uppercase; }
    .stream { overflow-y: auto; padding: 0 var(--s300) var(--s300); display: flex; flex-direction: column; gap: var(--s100); scroll-behavior: smooth; }
    .turn { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.45; opacity: 0; transform: translateY(8px); animation: rise 500ms var(--ease) forwards; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    .turn.agent { align-self: flex-start; background: var(--panel2); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
    .turn.rider { align-self: flex-end; background: #1a2a3f; border: 1px solid #244; border-bottom-right-radius: 6px; color: #d6ecff; }
    .who { font-size: 11px; color: var(--muted); margin: 0 4px 2px; }
    .reason { align-self: flex-start; max-width: 82%; font-family: "Geist Mono", ui-monospace, monospace; font-size: 11.5px; color: var(--muted); background: #15150c; border: 1px solid var(--line); border-left: 2px solid var(--accent); border-radius: 8px; padding: 6px 10px; opacity: 0; animation: rise 500ms var(--ease) forwards; }
    .reason b { color: var(--accent); font-weight: 600; }
    .empty { margin: auto; text-align: center; color: var(--muted); padding: var(--s400); }
    .empty .big { font-size: 40px; margin-bottom: var(--s200); }

    /* guard card */
    .guard { margin: var(--s200) var(--s300); padding: var(--s200); border: 1px solid var(--stop); border-radius: 16px; background: #1f1414; display: none; }
    .guard.show { display: block; animation: rise 400ms var(--ease); }
    .guard .q { font-weight: 600; margin-bottom: 6px; }
    .guard .says { color: var(--muted); font-size: 14px; margin-bottom: var(--s100); }
    .guard .btns { display: flex; gap: var(--s100); }
    .guard button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--line2); font: inherit; font-weight: 600; cursor: pointer; background: var(--panel2); color: var(--text); transition: all 300ms var(--ease); }
    .guard button:active { transform: scale(0.98); }

    /* door strip */
    .door { border-top: 1px solid var(--line); padding: var(--s100) var(--s300) var(--s200); overflow-x: auto; }
    .door .row { display: flex; gap: 8px; align-items: stretch; }
    .step { min-width: 150px; flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; color: var(--muted); transition: all 500ms var(--ease); }
    .step .n { font-family: "Geist Mono", monospace; font-size: 11px; color: var(--muted); }
    .step .t { color: var(--text); margin-top: 2px; line-height: 1.35; }
    .step.done { border-color: var(--go); background: #12231a; }
    .step.active { border-color: var(--accent); background: #1f1a0a; box-shadow: 0 0 0 1px var(--accent) inset; }
    .step.done .n, .step.active .n { color: inherit; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><span class="dot"></span> ToTheDoor</div>
      <div class="status" id="status"><span class="pill" id="statusPill">Idle</span></div>
    </header>
    <main>
      <section class="map">
        <div class="maptoggle">
          <button id="b3d" class="on">3D</button><button id="b2d">2D</button>
        </div>
        <div id="map3dHost"></div>
        <div id="map2d" style="display:none"></div>
        <div class="legend" id="legend"><b>Home</b> and the last 40 metres. A ring pulses when someone is on the way; the rider marker moves as the agent places him.</div>
      </section>
      <section class="conv">
        <h2>Live call</h2>
        <div class="stream" id="stream">
          <div class="empty" id="emptyState"><div class="big">🚪</div>Waiting for a delivery.<br />Tell the Telegram bot what's coming, then the rider calls.</div>
        </div>
        <div class="guard" id="guard">
          <div class="q">Someone's calling for directions</div>
          <div class="says" id="guardSays"></div>
          <div class="btns"><button id="allow" style="border-color:var(--go);color:var(--go)">Allow</button><button id="block" style="border-color:var(--stop);color:var(--stop)">Block</button></div>
        </div>
        <div class="door" id="door"><div class="row" id="doorRow"></div></div>
      </section>
    </main>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
